services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: facoffee-api-gateway
    hostname: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      USERS_UPSTREAM: host.docker.internal:3001
      PARTICIPATION_UPSTREAM: host.docker.internal:3002
      FINANCE_UPSTREAM: host.docker.internal:3003
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: facoffee-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: facoffee-keycloak
    hostname: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: facoffee
      KEYCLOAK_ADMIN_PASSWORD: facoffee
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-facoffee.json:/opt/keycloak/data/import/realm-facoffee.json:ro

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: facoffee-mailpit
    hostname: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Gerenciador de coordenação do Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: facoffee-zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # O container do Apache Kafka para resolver os WARNs de conexão do Spring
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: facoffee-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Configura duas pontes de escuta: uma interna para containers e outra (9092) para sua aplicação local rodando fora do Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    container_name: facoffee-postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: facoffee
      POSTGRES_PASSWORD: facoffee
      POSTGRES_DB: financedb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  keycloak_data:
  postgres_data:
